<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星闪开发板简易仿真器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif}
body{background:#0a0b0d;color:#e4e4e7;padding:20px;max-width:1100px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;padding-bottom:16px;margin-bottom:20px}
.mcu-status{display:flex;gap:8px;align-items:center}
.led{width:12px;height:12px;border-radius:50%;background:#52525b}
.led.run{background:#00e676;box-shadow:0 0 8px #00e676}
.grid{display:grid;grid-template-columns:1fr 300px;gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.board{background:#111418;border:1px solid #222;border-radius:14px;padding:14px}
.matrix{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;aspect-ratio:16/8}
.dot{background:#0b1f14;border-radius:2px;opacity:0.5}
.dot.on{background:#00e676;box-shadow:0 0 6px #00e676}
.console{margin-top:16px;border:1px solid #222;border-radius:10px;overflow:hidden}
.console-head{padding:8px 12px;background:#181b22;font-size:12px}
#serial{height:130px;padding:10px;overflow-y:auto;font-family:Consolas;font-size:12px;color:#aaa}
.panel{border:1px solid #222;border-radius:10px;padding:12px;margin-bottom:12px;background:rgba(255,255,255,0.02)}
.panel h4{font-size:11px;letter-spacing:2px;color:#888;margin-bottom:8px}
input[type="text"]{width:100%;padding:7px;background:#0004;border:1px solid #333;border-radius:6px;color:#fff;margin-bottom:8px}
input[type="range"]{width:100%}
.check-row{display:flex;gap:6px;align-items:center;margin:8px 0}
.btn-group{display:flex;gap:12px;margin-top:10px}
button{padding:10px 20px;border:none;border-radius:8px;font-size:15px;cursor:pointer}
#burn{background:#10b981;color:#fff}
#reset{background:#444;color:#fff}
</style>
</head>
<body>
<header>
  <div>星闪开发板简易仿真器</div>
  <div class="mcu-status">
    <span>状态</span>
    <div class="led" id="statusLed"></div>
  </div>
</header>
<div class="grid">
  <div class="board">
    <div class="matrix" id="ledMatrix"></div>
    <div class="console">
      <div class="console-head">串口控制台</div>
      <div id="serial"></div>
    </div>
  </div>
  <div class="control">
    <div class="panel">
      <h4>文字设置</h4>
      <input id="txtInput" type="text" value="hollowold">
      <div class="check-row">
        <input type="checkbox" id="scrollCheck">
        <label for="scrollCheck">滚动字幕</label>
      </div>
    </div>
    <div class="panel">
      <h4>亮度调节</h4>
      <input id="brightSlider" type="range" min="0.2" max="1" step="0.05" value="0.8">
    </div>
    <div class="btn-group">
      <button id="burn">烧录</button>
      <button id="reset">复位</button>
    </div>
  </div>
</div>

<script>
// 英文字模 8行高
const charFont = {
'h':[0x7E,0x12,0x12,0x12,0x7E,0x00,0x00,0x00],
'o':[0x3C,0x42,0x42,0x42,0x3C,0x00,0x00,0x00],
'l':[0x7C,0x08,0x08,0x08,0x7C,0x00,0x00,0x00],
'w':[0x42,0x42,0x54,0x54,0x66,0x00,0x00,0x00],
'd':[0x7C,0x42,0x42,0x42,0x7C,0x00,0x00,0x00]
};
const matrixEl = document.getElementById('ledMatrix');
const serialEl = document.getElementById('serial');
const statusLed = document.getElementById('statusLed');
const txtInput = document.getElementById('txtInput');
const scrollCheck = document.getElementById('scrollCheck');
const brightSlider = document.getElementById('brightSlider');
const burnBtn = document.getElementById('burn');
const resetBtn = document.getElementById('reset');

let dots = [];
let scrollTimer = null;
let scrollOffset = 0;
let brightness = 0.8;

// 初始化点阵 16*8=128
for(let i=0;i<128;i++){
    const d = document.createElement('div');
    d.className = 'dot';
    matrixEl.appendChild(d);
    dots.push(d);
}

// 写串口日志
function log(msg){
    serialEl.innerText += `> ${msg}\n`;
    serialEl.scrollTop = serialEl.scrollHeight;
}

// 清空点阵
function clearBuf(){
    return new Array(128).fill(0);
}

// 渲染点阵
function render(buf){
    for(let i=0;i<128;i++){
        if(buf[i]){
            dots[i].classList.add('on');
            dots[i].style.opacity = brightness;
        }else{
            dots[i].classList.remove('on');
        }
    }
}

// 文字转点阵缓冲区
function textToBuffer(text, offset=0){
    let buf = clearBuf();
    let pos = offset;
    for(let ch of text){
        if(!charFont[ch]) continue;
        let font = charFont[ch];
        for(let row=0;row<8;row++){
            let byte = font[row];
            for(let bit=0;bit<8;bit++){
                if(byte & (1 << (7-bit))){
                    let idx = row*16 + pos + bit;
                    if(idx >=0 && idx <128) buf[idx]=1;
                }
            }
        }
        pos += 9;
    }
    return buf;
}

// 停止滚动
function stopScroll(){
    if(scrollTimer){
        clearInterval(scrollTimer);
        scrollTimer=null;
    }
}

// 烧录
burnBtn.onclick = async ()=>{
    stopScroll();
    statusLed.classList.add('run');
    log("开始烧录...");
    await new Promise(r=>setTimeout(r,600));
    log("编译完成，加载字模");
    await new Promise(r=>setTimeout(r,400));
    log("烧录成功！");
    scrollOffset=0;
    if(scrollCheck.checked){
        scrollTimer = setInterval(()=>{
            scrollOffset--;
            render(textToBuffer(txtInput.value, scrollOffset));
        },180);
    }else{
        render(textToBuffer(txtInput.value,0));
    }
};

// 复位
resetBtn.onclick = ()=>{
    stopScroll();
    statusLed.classList.remove('run');
    render(clearBuf());
    log("复位，清空屏幕");
};

// 亮度拖动
brightSlider.oninput = ()=>{
    brightness = Number(brightSlider.value);
    document.querySelectorAll('.dot.on').forEach(d=>d.style.opacity=brightness);
};

// 初始清空
render(clearBuf());
log("系统上电就绪");
</script>
</body>
</html>
